name: Build Data EXE
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyttsx3 SpeechRecognition PyAudio openpyxl python-docx
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --console --name UltronData data.py

      - uses: actions/upload-artifact@v4
        with:
          name: UltronData-exe
          path: dist/UltronData.exe
